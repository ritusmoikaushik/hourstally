<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#1b2a41"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="80" y="104" font-size="24" font-weight="700" fill="#9fb0c7" letter-spacing="3">OVERTIME PAY</text>
    <text x="80" y="196" font-size="72" font-weight="700" fill="#fbf6e8">40 × 1.5 is right</text>
    <text x="80" y="282" font-size="72" font-weight="700" fill="#fbf6e8">until it isn't.</text>

    <!-- the four weeks it pays short, in what the shortcut underpays -->
    <g transform="translate(80, 352)">
      <rect width="240" height="178" rx="14" fill="#fbf6e8"/>
      <text x="120" y="92" font-size="56" font-weight="700" fill="#b3372c" text-anchor="middle">+$30</text>
      <text x="120" y="140" font-size="28" fill="#1b2a41" text-anchor="middle">bonus week</text>
    </g>
    <g transform="translate(346, 352)">
      <rect width="240" height="178" rx="14" fill="#fbf6e8"/>
      <text x="120" y="92" font-size="56" font-weight="700" fill="#b3372c" text-anchor="middle">+$6.67</text>
      <text x="120" y="140" font-size="28" fill="#1b2a41" text-anchor="middle">two rates</text>
    </g>
    <g transform="translate(612, 352)">
      <rect width="240" height="178" rx="14" fill="#fbf6e8"/>
      <text x="120" y="92" font-size="56" font-weight="700" fill="#b3372c" text-anchor="middle">+$22.50</text>
      <text x="120" y="140" font-size="28" fill="#1b2a41" text-anchor="middle">salaried</text>
    </g>
    <g transform="translate(878, 352)">
      <rect width="240" height="178" rx="14" fill="#fbf6e8"/>
      <text x="120" y="92" font-size="56" font-weight="700" fill="#b3372c" text-anchor="middle">+$80</text>
      <text x="120" y="140" font-size="28" fill="#1b2a41" text-anchor="middle">California</text>
    </g>

    <text x="1118" y="582" font-size="22" fill="#9fb0c7" text-anchor="end">what the shortcut underpays, per week</text>
  </g>
</svg>
